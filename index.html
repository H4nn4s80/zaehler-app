<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zähler">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script>/* Darstellung vor dem ersten Zeichnen setzen (kein Aufblitzen) */try{var m=localStorage.getItem('zaehler-theme');if(m==='light'||m==='dark')document.documentElement.dataset.theme=m;}catch(e){}</script>
<meta name="format-detection" content="telephone=no">
<title>Zähler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --muted: #8e8e93; --line: #e5e5ea;
    --soft: #f2f2f7; --danger: #ff3b30; --orange: #ff9500; --accent: #007aff; --shadow: 0 1px 3px rgba(0,0,0,.07);
    --toast: #1c1c1e; --seg-on: #fff; --backdrop: rgba(0,0,0,.4); color-scheme: light;
  }
  /* Dunkelmodus: folgt dem System, außer im Menü ist „Hell“/„Dunkel“ gewählt (html[data-theme]) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --muted: #98989f; --line: #38383a; --soft: #2c2c2e; --shadow: none;
      --accent: #0a84ff; --danger: #ff453a; --orange: #ff9f0a; --toast: #3a3a3c; --seg-on: #636366; --backdrop: rgba(0,0,0,.6); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --muted: #98989f; --line: #38383a; --soft: #2c2c2e; --shadow: none;
      --accent: #0a84ff; --danger: #ff453a; --orange: #ff9f0a; --toast: #3a3a3c; --seg-on: #636366; --backdrop: rgba(0,0,0,.6); color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(var(--sat) + 10px) calc(var(--sar) + 16px)
                  calc(var(--sab) + 90px) calc(var(--sal) + 16px);
         min-height: 100vh; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  /* Kopfzeile: 8 px tiefer (relativ -> übriges Layout unverändert), ganzzahlige Zeilenhöhe -> Text auf ganzen Pixeln */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; position: relative; top: 8px; }
  h1 { font-size: 34px; margin: 4px 0 12px; letter-spacing: -0.6px; }
  /* v8: Navigationsleiste wie iOS – 17 px Systemschrift, normal (400), Systemblau, ganzzahlige Zeilenhöhe, 44×44 Tippfläche, gedrückt = transparent */
  .iconbtn { border: 0; background: transparent; color: var(--accent); font: 400 17px/22px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -0.41px; min-height: 44px; min-width: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    -webkit-tap-highlight-color: transparent; transition: opacity .3s ease-out; -webkit-font-smoothing: antialiased; }
  .iconbtn:active { opacity: .25; transition: none; }
  .iconbtn.nav-back { padding: 0 8px 0 0; margin-left: -1px; gap: 6px; }
  .iconbtn.nav-back svg { width: 12px; height: 21px; flex: none; display: block; }
  .top .iconbtn:last-child:not(:first-child) { padding-right: 0; margin-right: -1px; }
  .top .iconbtn:first-child:not(.nav-back) { padding-left: 0; }
  .iconbtn.big { font-size: 24px; }

  /* Kacheln */
  #list { display: block; }
  .tile { display: flex; align-items: stretch; background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; border-left: 6px solid var(--c); transition: transform .1s; }
  .tile.pulse { animation: pulse .5s; }
  @keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.025)} 100%{transform:scale(1)} }
  .tile-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px 10px 14px 12px;
    border: 0; background: transparent; text-align: left; }
  .emoji { font-size: 34px; width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); }
  .tile-text { min-width: 0; }
  .tile-name { font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-count { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile-count small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .tile-sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plus { flex: none; width: 92px; border: 0; background: var(--c); color: #fff; font-size: 28px; font-weight: 800;
    letter-spacing: -0.5px; transition: filter .1s, transform .08s; }
  .plus:active { filter: brightness(.85); }
  .bar { height: 5px; border-radius: 3px; background: var(--soft); margin-top: 6px; overflow: hidden; width: 140px; max-width: 100%; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  #newBtn { display: block; width: 100%; margin-top: 14px; min-height: 54px; border-radius: 16px; border: 2px dashed var(--line);
    background: transparent; color: var(--accent); font-weight: 600; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 10px 10px; }
  .empty-state div { font-size: 54px; }

  /* Detail */
  .d-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
  .d-head .emoji { width: 58px; height: 58px; font-size: 40px; border-radius: 16px; }
  .d-head h1 { margin: 0; font-size: 28px; line-height: 1.15; word-break: break-word; }
  .d-head .tile-sub { font-size: 15px; white-space: normal; }
  #dPlus { display: block; width: 100%; min-height: 86px; border: 0; border-radius: 22px; background: var(--c); color: #fff;
    font-size: 30px; font-weight: 800; box-shadow: 0 8px 20px color-mix(in srgb, var(--c) 35%, transparent); transition: transform .08s; }
  #dPlus:active { transform: scale(.97); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .since { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-top: 8px; box-shadow: var(--shadow); font-size: 15px; }
  .since b { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: 18px; margin-top: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0;
    padding: 14px 16px 6px; font-weight: 600; }
  ol.rows { list-style: none; margin: 0; padding: 0 0 4px; }
  ol.rows li { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; min-height: 50px; border-top: 1px solid var(--line); }
  ol.rows li:first-child { border-top: 0; }
  .nr { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; border: 2px solid var(--line); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  li.filled .nr { background: var(--c); border-color: var(--c); color: #fff; }
  li.next .nr { border-style: dashed; border-color: var(--c); color: var(--c); }
  li.latest { background: color-mix(in srgb, var(--c) 10%, transparent); }
  .when { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  .when .note { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when .rel { color: var(--muted); font-size: 13px; }
  li.emptyrow .when { color: var(--muted); opacity: .5; }
  .rowbtn { border: 0; background: transparent; color: var(--muted); min-width: 40px; min-height: 40px; font-size: 18px; border-radius: 10px; }
  .rowbtn:active { background: var(--soft); }
  .rowbtn.del { color: var(--danger); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; min-height: 50px; border-radius: 14px; border: 0; background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; box-shadow: var(--shadow); padding: 0 10px; }
  .btn:active { filter: brightness(.94); }
  .btn:disabled { opacity: .4; }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--accent); color: #fff; }
  details.card summary { padding: 14px 16px; font-weight: 600; list-style: none; min-height: 50px; cursor: pointer; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "›"; float: right; color: var(--muted); font-size: 22px; line-height: 1; transition: transform .2s; }
  details.card[open] summary::after { transform: rotate(90deg); }
  .past { border-top: 1px solid var(--line); padding: 10px 0 0; }
  .past h3 { margin: 0 0 3px; padding: 0 16px; font-size: 15px; }
  .past-rows li { min-height: 42px; }
  .past p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 16px 12px; }

  /* Sheet / Dialog */
  #sheet { position: fixed; inset: 0; background: var(--backdrop); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  #sheet.show { display: flex; }
  #sheet .box { background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(var(--sab) + 18px); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .5 } to { transform: none; opacity: 1 } }
  #sheet h2 { margin: 0 0 12px; font-size: 20px; }
  #sheet p { margin: 0 0 14px; white-space: pre-line; }
  #sheet .row { margin-top: 16px; }
  #sheet .btn { box-shadow: none; background: var(--soft); }
  #sheet .btn.primary { background: var(--accent); color: #fff; }
  #sheet .btn.danger { color: var(--danger); }
  .field { margin-bottom: 14px; }
  .field label, .lbl { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 6px 2px; }
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); -webkit-user-select: text; user-select: text; min-height: 48px; }
  .field textarea { min-height: 80px; resize: vertical; }
  /* Großes Emoji-Feld: Antippen öffnet die Tastatur, über 🌐/😀 kommt man zu den Emojis */
  .emoji-big { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 18px; border: 2px dashed var(--line);
    background: var(--bg); cursor: text; margin-bottom: 10px; }
  .field label.emoji-big { display: flex; text-transform: none; letter-spacing: normal; font-size: inherit; color: inherit; margin: 0 0 10px; }
  .emoji-big:focus-within { border-style: solid; border-color: var(--accent); }
  .field .emoji-big input#fEmoji { flex: none; width: 84px; height: 84px; min-height: 84px; padding: 0; border-radius: 16px; border: 0;
    background: var(--card); text-align: center; font-size: 52px; line-height: 84px; caret-color: transparent;
    box-shadow: var(--shadow); -webkit-user-select: text; user-select: text; }
  #fEmoji:focus { outline: none; }
  #fEmoji::selection { background: transparent; }
  .emoji-hint { flex: 1; min-width: 0; font-size: 15px; color: var(--muted); line-height: 1.35; }
  .emoji-hint b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 2px; }
  .picks { display: flex; flex-wrap: wrap; gap: 4px; }
  .picks button { border: 0; background: var(--soft); border-radius: 10px; width: 38px; height: 38px; font-size: 21px; padding: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; background: var(--sw);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  .swatches button.on { border-color: var(--ink); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 44px; }
  .check input { width: 22px; height: 22px; flex: none; }
  .small { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }
  .menu .btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 0 14px; }

  /* Backup-Banner */
  #backupBanner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--card); border-radius: 14px;
    box-shadow: var(--shadow); border-left: 4px solid var(--accent); padding: 10px 10px 10px 14px; margin: 2px 0 6px; font-size: 15px; }
  #backupBanner[hidden] { display: none !important; }
  #bbMsg { flex: 1 1 180px; font-weight: 600; }
  #backupBanner .bb-btns { display: flex; gap: 8px; margin-left: auto; }
  #backupBanner button { border: 0; border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 600; }
  #bbNow { background: var(--accent); color: #fff; }
  #bbLater { background: var(--soft); color: var(--ink); }
  .ivs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .ivs .btn { margin: 0; font-size: 15px; padding: 0 6px; }
  #sheet .ivs .btn.on { background: var(--accent); color: #fff; }
  .menu-sec { margin: 4px 0 12px; }
  /* v7: Ziele, Diagramm, Erinnerungen, Anordnen */
  .goal { margin-top: 6px; }
  .goal .bar { margin-top: 0; }
  .goal-txt { display: block; font-size: 13px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.goal-done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
  .goal-done .goal-txt, .goal-card.done .goal-txt { color: var(--c); font-weight: 600; }
  .tile-sub.due { color: var(--c); font-weight: 600; }
  .goal-card { padding: 12px 16px 14px; }
  .goal-card h2 { padding: 0 0 8px !important; }
  .goal-card .bar { width: 100%; height: 10px; border-radius: 5px; }
  .goal-card .goal-txt { font-size: 15px; margin-top: 6px; }
  .goal-card.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
  .chart-card { padding-bottom: 12px; }
  .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 0 16px; }
  .chart-head h2 { padding: 4px 0 !important; }
  .seg { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: transparent; border-radius: 8px; min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  #chart { display: block; width: 100%; height: auto; margin-top: 6px; }
  #chart text { font: 10px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--muted); }
  #chart .val { fill: var(--ink); font-weight: 600; }
  /* Version 3.3: Balken antippbar – ganze Spalte, kurzes Aufleuchten beim Drücken, markiert solange das Tagesblatt offen ist */
  #chart, #yearGrid { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #chart .bar-g { cursor: pointer; outline: none; }
  #chart text, #chart line { pointer-events: none; } /* Ziel-Linie/Beschriftung dürfen den Tipp nicht abfangen */
  #chart .bar-hit { fill: transparent; transition: fill .15s; }
  #chart .bar-g:active .bar-hit, #chart .bar-g:focus-visible .bar-hit { fill: color-mix(in srgb, var(--c) 10%, transparent); }
  #chart .bar-g.sel .bar-hit { fill: color-mix(in srgb, var(--c) 16%, transparent); }
  #chart .cbar { transition: transform .12s; transform-box: fill-box; transform-origin: 50% 100%; }
  #chart .bar-g:active .cbar { transform: scaleY(.96); }
  #chart .bar-g.sel .cbar { opacity: 1 !important; }
  #yearGrid { cursor: pointer; }
  #yearGrid rect.ysel { stroke: var(--ink); stroke-width: 1.2px; }
  .day-sheet .day-sub { margin: 0 0 2px; color: var(--muted); font-size: 14px; font-weight: 600; }
  .day-sheet .day-sub .day-em { font-size: 15px; }
  .day-sheet h2 { margin-top: 0; }
  .day-sheet .day-sum { margin: -4px 0 6px; font-size: 16px; } .day-sheet .day-sum b { color: var(--c); }
  .day-sheet .day-note { margin: 0 0 8px; }
  .day-sheet .day-rows { margin: 0 -6px 12px; border-radius: 16px; overflow: hidden; background: color-mix(in srgb, var(--card) 55%, transparent); }
  .day-sheet .day-row { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; min-height: 52px; padding: 6px 0; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; }
  .day-sheet button.day-row:active { opacity: .6; }
  .day-sheet .dtime { font-weight: 600; }
  .day-sheet .rchev { color: var(--muted); font-size: 20px; margin-right: 2px; }
  .day-sheet .thumb { width: 44px; height: 44px; }
  .day-sheet .day-grp h3 { display: flex; justify-content: space-between; margin: 14px 2px 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .day-sheet .day-grp h3 span { color: var(--c); }
  .day-sheet .day-empty { text-align: center; color: var(--muted); padding: 22px 8px 26px; margin: 0 0 8px; border-radius: 16px; background: color-mix(in srgb, var(--card) 45%, transparent); }
  .chart-foot { display: flex; justify-content: space-between; gap: 8px; padding: 2px 16px 0; font-size: 14px; color: var(--muted); }
  .chart-foot b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .rem-card { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 15px; }
  .rem-card .btn { flex: none; min-height: 40px; font-size: 14px; }
  .lp-hint { margin: 8px 4px 0; font-size: 13px; color: var(--muted); text-align: center; }
  .goal-row, .rem-row { display: flex; gap: 8px; align-items: center; }
  .goal-row input { flex: 1; min-width: 0; }
  .goal-row span { color: var(--muted); }
  .field select, .field input[type=time] { font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); min-height: 48px; }
  .field label.check { display: flex; text-transform: none; letter-spacing: normal; font-size: 16px; color: inherit; margin: 0; }
  .wdays { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .wdays button { border: 0; background: var(--soft); color: var(--ink); border-radius: 10px; min-width: 42px; min-height: 38px; padding: 0 8px; font-size: 14px; font-weight: 600; }
  .wdays button.on { background: var(--accent); color: #fff; }
  #remBox .btn { display: block; width: 100%; margin-top: 4px; }
  .plus, #dPlus { -webkit-touch-callout: none; }
  /* Anordnen */
  #arrangeBtn { display: block; margin: 10px auto 0; border: 0; background: transparent; color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 12px; }
  #arrangeHint { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 10px; }
  .arr { display: none; flex: none; align-items: center; gap: 2px; padding: 0 6px; }
  #list.arranging .arr { display: flex; }
  #list.arranging .plus, #list.arranging .plus-pair { display: none; }
  #list.arranging .tile-main { pointer-events: none; }
  .arr button { border: 0; background: var(--soft); color: var(--ink); border-radius: 10px; width: 40px; height: 40px; font-size: 16px; padding: 0; }
  .arr button:disabled { opacity: .3; }
  .arr .handle { background: transparent; font-size: 22px; color: var(--muted); touch-action: none; cursor: grab; }
  .tile.dragging { box-shadow: 0 8px 24px rgba(0,0,0,.18); outline: 2px solid var(--c); }
  /* v7b: Kategorien, Minus/Mehrfach, Serien, Kosten */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 12px; padding: 2px 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; border: 0; border-radius: 17px; min-height: 34px; padding: 0 14px; background: var(--card); color: var(--ink);
    font-size: 15px; font-weight: 600; box-shadow: var(--shadow); white-space: nowrap; }
  .chips button.on { background: var(--accent); color: #fff; }
  .group + .group { margin-top: 18px; }
  .cat-h { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; margin: 0 4px 8px; }

    --m-grp: rgba(255,255,255,.085); --m-grp-hl: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 .5px rgba(255,255,255,.06); --m-sep: rgba(84,84,88,.55); --m-press: rgba(255,255,255,.10); --m-foot: #a1a1a8; } }
  :root[data-theme="dark"] { --gs-track: rgba(118,118,128,.30);
    --gs-thumb: linear-gradient(180deg, rgba(64,156,255,.98), rgba(10,132,255,.92)); --gs-on: #fff;
    --gs-th-sh: 0 3px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 .5px rgba(255,255,255,.12);
    --m-grp: rgba(255,255,255,.085); --m-grp-hl: inset 0 1px 0 rgba(255,255,255,.08), inset 0 0 0 .5px rgba(255,255,255,.06); --m-sep: rgba(84,84,88,.55); --m-press: rgba(255,255,255,.10); --m-foot: #a1a1a8; }
  #sheet .mx { font-family: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* Glas-Segmente: eine Spur, erhabener glänzender Daumen gleitet zur Auswahl */
  .gseg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); padding: 3px; border-radius: 999px; isolation: isolate;
    background: var(--gs-track); box-shadow: inset 0 1px 2px rgba(0,0,0,.06); }

    transform: translateX(calc(100% * var(--i))); background: var(--gs-thumb); box-shadow: var(--gs-th-sh); transition: transform .34s cubic-bezier(.3,1.3,.5,1); }

    font: 500 14px/1.15 -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -.15px; overflow-wrap: anywhere; transition: color .2s, opacity .15s; -webkit-tap-highlight-color: transparent; }

  .gseg-b:not(.on):active { opacity: .45; transition: none; }
  /* Gruppierte Liste (inset grouped) auf Glas */
  .mx .m-group, .mx .m-card { margin: 16px 0 0; border-radius: 24px; overflow: hidden; background: var(--m-grp); box-shadow: var(--m-grp-hl); }
  .mx .m-card { padding: 14px 16px 12px; }
  .m-row { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; margin: 0; padding: 8px 16px; border: 0; border-radius: 0;
    background: transparent; color: var(--ink); text-align: left; font: 400 17px/22px -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -.41px; -webkit-tap-highlight-color: transparent; }
  .m-row + .m-row::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; height: .5px; background: var(--m-sep); }

  /* „Jetzt sichern“: auffällige getönte Glas-Kapsel */
  .m-cta { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; margin: 0 0 10px; border: 0; border-radius: 999px; color: #fff;
    background: var(--accent); background-image: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 20px -8px color-mix(in srgb, var(--accent) 70%, transparent);
    font: 600 17px/22px -apple-system, "SF Pro Text", BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: -.41px; transition: transform .12s, opacity .2s; }

  #sheet .mx .m-note { margin: 0 2px 4px; font-size: 13px; line-height: 18px; color: var(--m-foot); }
  .mx .m-note b { color: var(--ink); font-weight: 600; }

  /* ================= v10: flüssiges Scrollen ================= */
  /* Weichzeichner nur noch auf festen Flächen (Leiste beim Scrollen, Blatt, Meldung). Was mitscrollt, bekommt dieselbe Glasfarbe ohne Weichzeichner –
     über dem ruhigen Farbverlauf-Hintergrund sieht das gleich aus, kostet beim Scrollen aber nichts. */
  #newBtn, #arrangeBtn, #archiveBtn, .search input, #searchBtn { -webkit-backdrop-filter: none; backdrop-filter: none; }
  /* In der Glas-Leiste: Knöpfe nicht ein zweites Mal weichzeichnen (Leiste tut das schon) */
  html.scrolled .top .iconbtn { -webkit-backdrop-filter: none; backdrop-filter: none; }
  /* Kacheln/Zeilen: Änderungen (laufende Uhr, Fortschritt) bleiben in der Kachel – kein Neu-Layout der ganzen Seite */
  .tile { contain: layout style; }
  #entryList li { contain: layout style; }
  [data-clock] { font-variant-numeric: tabular-nums; }
  /* Fester Hintergrund als eigene Ebene (wird beim Scrollen nicht neu gezeichnet) */
  body::before { transform: translateZ(0); }
  /* Blatt: Hintergrund-Seite scrollt nicht mit, Abdunklung als eigene Ebene (beim Runterziehen nur opacity) */

  #sheet { background: transparent !important; overscroll-behavior: contain; }
  #sheetDim { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: color-mix(in srgb, var(--backdrop) 75%, transparent); }
  html.pulling #sheetDim { will-change: opacity; } html.pulling #sheetCard { will-change: transform; }
  #sheet .box { -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }

  /* ================= v11: Überblick, Ring, letzte Einträge, Jahres-Raster, Limit, Feier ================= */
  /* alles im Scroller: Glasfarbe ohne Weichzeichner (v10-Regel) */
  #dPlus { position: relative; }
  /* Version 3: Vibration wie ios-haptics (Stand Mai 2026): unsichtbares <label> über der ganzen Taste, der Switch selbst ist 1 px groß und

  html.no-hap .hap { display: none; }
  .plus, .note-chips button { position: relative; }
  /* Version 3.4: Getränke – Klein / Groß als zwei Glas-Tasten (Kachel: übereinander, Detail: nebeneinander, Fällig: zwei Pillen) */

    font-size: 17px; font-weight: 800; letter-spacing: 0; line-height: 1.05; border-radius: 16px; }

  .plus.sz-s, .dsz-s { background-color: color-mix(in srgb, var(--c) 78%, #fff); }
  .d-sizes { display: flex; gap: 10px; } .d-sizes[hidden] { display: none; }
  .dsz { position: relative; flex: 1 1 0; min-width: 0; min-height: 86px; border: 0; border-radius: 30px; color: #fff; background-color: var(--c);
    background-image: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.06) 50%, rgba(0,0,0,.05));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.55), inset 0 0 0 .5px rgba(255,255,255,.28), 0 12px 28px -10px color-mix(in srgb, var(--c) 70%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; font-size: 24px; font-weight: 800; text-shadow: 0 1px 1px rgba(0,0,0,.12);
    transition: transform .08s; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .dsz small { font-size: 14px; }

  .due-plus.sz { min-width: 0; padding: 0 12px; font-size: 14px; } .due-plus.sz + .due-plus.sz { margin-left: -4px; }
  .due-plus.sz[data-size="s"] { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 55%, #fff), color-mix(in srgb, var(--c) 82%, #fff)); }
  .chip-sz { font-size: 12px; font-weight: 600; opacity: .75; }
  .stat .lit { display: block; margin-top: 2px; font-size: 13px; font-weight: 700; color: var(--c); font-variant-numeric: tabular-nums; }
  .stat .lit[hidden] { display: none; }

  .tile-sub.tile-lit { color: var(--c); font-weight: 600; }
  .size-hint { display: flex; align-items: center; gap: 10px; margin: 2px 0 10px; padding: 10px 12px; border-radius: 16px; background: color-mix(in srgb, var(--c, #007aff) 12%, transparent); font-size: 14px; }
  .size-hint span { flex: 1; } .size-hint .btn { flex: none; min-height: 36px; padding: 0 14px; font-size: 14px; }
  /* Version 3.5 */

    background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-tap-highlight-color: transparent; }
  .note-chips button:active { filter: brightness(.9); transform: scale(.97); }
  .year-card { padding-bottom: 12px; }

const ICS_DAYS = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU']; // ISO-Wochentag 1..7

/* ---------- v7: Daten normalisieren (verlustfrei; alte Daten ohne goal/reminder bleiben gültig) ---------- */
function normalizeDb(s) {

    if ('goal' in c && !(c.goal = sanitizeGoal(c.goal))) delete c.goal;
    if ('reminder' in c && !(c.reminder = sanitizeReminder(c.reminder))) delete c.reminder;
    if ('step' in c && !(Number.isInteger(c.step) && c.step >= 1 && c.step <= 999)) delete c.step;
    if ('category' in c) { if (typeof c.category === 'string' && c.category.trim()) c.category = c.category.trim().slice(0, 30); else delete c.category; }
    if ('price' in c && !isPrice(c.price)) delete c.price;
    if ('archived' in c && c.archived !== true) delete c.archived; // v7c
    if ('reset' in c && !['day', 'week', 'month'].includes(c.reset)) delete c.reset; // Version 3b: Auto-Reset day|week|month
    if ('locked' in c && c.locked !== true) delete c.locked; // Version 3b: gesperrt
    if ('hidden' in c && c.hidden !== true && c.hidden !== 'blur') delete c.hidden; // Version 3.1: versteckt (true = unsichtbar, 'blur' = unscharf)
    if ('sizes' in c && !(c.sizes = sanitizeSizes(c.sizes))) delete c.sizes; // Version 3.4
    if ('runningSince' in c && !(c.type === 'time' && typeof c.runningSince === 'string' && !isNaN(new Date(c.runningSince)))) delete c.runningSince;
  });
  for (const e of s.entries) { // v7b: Menge/Preis pro Eintrag (fehlen bei alten Daten = 1 bzw. Zählerpreis)
    if (e && 'amount' in e && !validAmount(e.amount)) delete e.amount;
    if (e && 'price' in e && !isPrice(e.price)) delete e.price;
    if (e && 'duration' in e && !validDuration(e.duration)) delete e.duration; // v7c
    if (e && 'photo' in e && !(typeof e.photo === 'string' && e.photo && e.photo.length <= 80)) delete e.photo;
    if (e && 'size' in e && e.size !== 's' && e.size !== 'l') delete e.size; // Version 3.4
    if (e && 'vol' in e && !isVol(e.vol)) delete e.vol;
  }
  // Version 3.5: einmalige Umstellung – bestehende Getränke-Zähler (Bier, Wasser, Kaffee, Wein, Saft, Cola, Tee …) bekommen Klein / Groß.
  // Merker settings.sizesAuto: danach wird nie wieder automatisch eingeschaltet (selbst ausgeschaltet bleibt aus). Alte Einträge bleiben ohne Größe.
  // Läuft nur im Speicher; dauerhaft wird es mit dem nächsten Speichern (bis dahin bei jedem Start gleich – idempotent).
  if (s.settings.sizesAuto !== true) {
    s.counters.forEach(c => { if (c && c.type !== 'time' && !('sizes' in c) && isDrinkLike(c.name, c.category)) c.sizes = drinkDefaults(c.name); });
    s.settings.sizesAuto = true;

}

const THEME_KEY = 'zaehler-theme', THEME_BG = { light: '#f2f2f7', dark: '#000000' };
const themeMode = () => (['light', 'dark'].includes(lsGet(THEME_KEY)) ? lsGet(THEME_KEY) : 'auto');
function applyTheme() {
  const m = themeMode(), root = document.documentElement;
  if (m === 'auto') delete root.dataset.theme; else root.dataset.theme = m;
  // Statusleiste/Browserleiste: theme-color passend zur gewählten Darstellung
  document.querySelectorAll('meta[name="theme-color"]').forEach(el => {
    if (!el.dataset.media) el.dataset.media = el.getAttribute('media') || '';
    const dark = /dark/.test(el.dataset.media);
    if (m === 'auto') { el.setAttribute('media', el.dataset.media); el.content = dark ? THEME_BG.dark : THEME_BG.light; }
    else { el.removeAttribute('media'); el.content = THEME_BG[m]; }
  });
}
function setTheme(m) {
  if (m === 'light' || m === 'dark') lsSet(THEME_KEY, m); else { try { localStorage.removeItem(THEME_KEY); } catch (e) {} }
  applyTheme();
}
if (window.matchMedia) { try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {} }

/* ---------- Updates / Service Worker ---------- */
let swReg = null, reloadPending = false;
const SW_RELOAD_KEY = 'zaehler-sw-reloaded';
function swUpdate() { if (swReg) swReg.update().catch(() => {}); }
function reloadForUpdate() {
  // Endlosschleife verhindern: höchstens ein automatischer Reload pro Seitenaufruf-Kette innerhalb 30 s
  let last = 0; try { last = +sessionStorage.getItem(SW_RELOAD_KEY) || 0; } catch (e) {}
  const now = performance.timeOrigin + performance.now();
  if (last && now - last < 30000) return;
  try { sessionStorage.setItem(SW_RELOAD_KEY, String(now)); } catch (e) {}
  if ($('sheet').classList.contains('show')) { reloadPending = true; return; } // nicht mitten im Bearbeiten neu laden
  location.reload();
}
function setupServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadForUpdate(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; swUpdate(); }).catch(() => {});
}
async function checkForUpdates() {
  toast(t('updating'), [], 10000);
  const scope = new URL('./', location.href).href;
  try { // nur die eigene Registrierung und eigene Caches – localStorage (Nutzerdaten) bleibt unangetastet
    const regs = navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? await navigator.serviceWorker.getRegistrations() : [];
    await Promise.all(regs.filter(r => r.scope === scope).map(r => r.unregister()));
  } catch (e) {}
  try { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('zaehler-')).map(k => caches.delete(k))); } catch (e) {}
  try { sessionStorage.removeItem(SW_RELOAD_KEY); } catch (e) {}
  location.replace(location.pathname + '?update=' + Date.now() + location.hash); // Query umgeht den HTTP-Cache
}
