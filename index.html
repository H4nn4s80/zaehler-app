<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zähler">
<meta name="theme-color" content="#f2f2f7">
<meta name="format-detection" content="telephone=no">
<title>Zähler</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --ink: #1c1c1e; --muted: #8e8e93; --line: #e5e5ea;
    --soft: #f2f2f7; --danger: #ff3b30; --accent: #007aff; --shadow: 0 1px 3px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --ink: #f2f2f7; --muted: #98989f; --line: #2c2c2e; --soft: #2c2c2e; --shadow: none; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 16px)
                  calc(env(safe-area-inset-bottom) + 90px) calc(env(safe-area-inset-left) + 16px);
         min-height: 100vh; -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
  [hidden] { display: none !important; }
  /* Kopfzeile: 8 px tiefer (relativ -> übriges Layout unverändert), ganzzahlige Zeilenhöhe -> Text auf ganzen Pixeln */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; position: relative; top: 8px; }
  h1 { font-size: 34px; margin: 4px 0 12px; letter-spacing: -0.6px; }
  .iconbtn { border: 0; background: transparent; color: var(--accent); font-size: 17px; font-weight: 500; line-height: 24px;
    min-height: 44px; min-width: 44px; padding: 0 6px; }
  .iconbtn.big { font-size: 24px; }

  /* Kacheln */
  #list { display: grid; gap: 12px; }
  .tile { display: flex; align-items: stretch; background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    overflow: hidden; border-left: 6px solid var(--c); transition: transform .1s; }
  .tile.pulse { animation: pulse .5s; }
  @keyframes pulse { 0%{transform:scale(1)} 40%{transform:scale(1.025)} 100%{transform:scale(1)} }
  .tile-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px 10px 14px 12px;
    border: 0; background: transparent; text-align: left; }
  .emoji { font-size: 34px; width: 48px; height: 48px; flex: none; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; background: color-mix(in srgb, var(--c) 16%, transparent); }
  .tile-text { min-width: 0; }
  .tile-name { font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-count { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile-count small { font-size: 15px; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .tile-sub { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plus { flex: none; width: 92px; border: 0; background: var(--c); color: #fff; font-size: 28px; font-weight: 800;
    letter-spacing: -0.5px; transition: filter .1s, transform .08s; }
  .plus:active { filter: brightness(.85); }
  .bar { height: 5px; border-radius: 3px; background: var(--soft); margin-top: 6px; overflow: hidden; width: 140px; max-width: 100%; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
  #newBtn { display: block; width: 100%; margin-top: 14px; min-height: 54px; border-radius: 16px; border: 2px dashed var(--line);
    background: transparent; color: var(--accent); font-weight: 600; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 10px 10px; }
  .empty-state div { font-size: 54px; }

  /* Detail */
  .d-head { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
  .d-head .emoji { width: 58px; height: 58px; font-size: 40px; border-radius: 16px; }
  .d-head h1 { margin: 0; font-size: 28px; line-height: 1.15; word-break: break-word; }
  .d-head .tile-sub { font-size: 15px; white-space: normal; }
  #dPlus { display: block; width: 100%; min-height: 86px; border: 0; border-radius: 22px; background: var(--c); color: #fff;
    font-size: 30px; font-weight: 800; box-shadow: 0 8px 20px color-mix(in srgb, var(--c) 35%, transparent); transition: transform .08s; }
  #dPlus:active { transform: scale(.97); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .stat { background: var(--card); border-radius: 14px; padding: 10px 6px; text-align: center; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .since { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-top: 8px; box-shadow: var(--shadow); font-size: 15px; }
  .since b { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border-radius: 18px; margin-top: 16px; overflow: hidden; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0;
    padding: 14px 16px 6px; font-weight: 600; }
  ol.rows { list-style: none; margin: 0; padding: 0 0 4px; }
  ol.rows li { display: flex; align-items: center; gap: 12px; padding: 0 12px 0 16px; min-height: 50px; border-top: 1px solid var(--line); }
  ol.rows li:first-child { border-top: 0; }
  .nr { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; border: 2px solid var(--line); color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  li.filled .nr { background: var(--c); border-color: var(--c); color: #fff; }
  li.next .nr { border-style: dashed; border-color: var(--c); color: var(--c); }
  li.latest { background: color-mix(in srgb, var(--c) 10%, transparent); }
  .when { flex: 1; min-width: 0; font-variant-numeric: tabular-nums; }
  .when .note { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when .rel { color: var(--muted); font-size: 13px; }
  li.emptyrow .when { color: var(--muted); opacity: .5; }
  .rowbtn { border: 0; background: transparent; color: var(--muted); min-width: 40px; min-height: 40px; font-size: 18px; border-radius: 10px; }
  .rowbtn:active { background: var(--soft); }
  .rowbtn.del { color: var(--danger); }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  .btn { flex: 1; min-height: 50px; border-radius: 14px; border: 0; background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; box-shadow: var(--shadow); padding: 0 10px; }
  .btn:active { filter: brightness(.94); }
  .btn:disabled { opacity: .4; }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--accent); color: #fff; }
  details.card summary { padding: 14px 16px; font-weight: 600; list-style: none; min-height: 50px; cursor: pointer; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "›"; float: right; color: var(--muted); font-size: 22px; line-height: 1; transition: transform .2s; }
  details.card[open] summary::after { transform: rotate(90deg); }
  .past { border-top: 1px solid var(--line); padding: 10px 16px; }
  .past h3 { margin: 0 0 3px; font-size: 15px; }
  .past p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 14px; margin: 6px 16px 12px; }

  /* Sheet / Dialog */
  #sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  #sheet.show { display: flex; }
  #sheet .box { background: var(--card); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom) + 18px); animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .5 } to { transform: none; opacity: 1 } }
  #sheet h2 { margin: 0 0 12px; font-size: 20px; }
  #sheet p { margin: 0 0 14px; white-space: pre-line; }
  #sheet .row { margin-top: 16px; }
  #sheet .btn { box-shadow: none; background: var(--soft); }
  #sheet .btn.primary { background: var(--accent); color: #fff; }
  #sheet .btn.danger { color: var(--danger); }
  .field { margin-bottom: 14px; }
  .field label, .lbl { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 6px 2px; }
  .field input[type=text], .field input[type=number], .field input[type=datetime-local], .field textarea {
    width: 100%; font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); -webkit-user-select: text; user-select: text; min-height: 48px; }
  .field textarea { min-height: 80px; resize: vertical; }
  /* Großes Emoji-Feld: Antippen öffnet die Tastatur, über 🌐/😀 kommt man zu den Emojis */
  .emoji-big { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 18px; border: 2px dashed var(--line);
    background: var(--bg); cursor: text; margin-bottom: 10px; }
  .field label.emoji-big { display: flex; text-transform: none; letter-spacing: normal; font-size: inherit; color: inherit; margin: 0 0 10px; }
  .emoji-big:focus-within { border-style: solid; border-color: var(--accent); }
  .field .emoji-big input#fEmoji { flex: none; width: 84px; height: 84px; min-height: 84px; padding: 0; border-radius: 16px; border: 0;
    background: var(--card); text-align: center; font-size: 52px; line-height: 84px; caret-color: transparent;
    box-shadow: var(--shadow); -webkit-user-select: text; user-select: text; }
  #fEmoji:focus { outline: none; }
  #fEmoji::selection { background: transparent; }
  .emoji-hint { flex: 1; min-width: 0; font-size: 15px; color: var(--muted); line-height: 1.35; }
  .emoji-hint b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 2px; }
  .picks { display: flex; flex-wrap: wrap; gap: 4px; }
  .picks button { border: 0; background: var(--soft); border-radius: 10px; width: 38px; height: 38px; font-size: 21px; padding: 0; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid transparent; background: var(--sw);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
  .swatches button.on { border-color: var(--ink); }
  .check { display: flex; align-items: center; gap: 10px; font-size: 16px; min-height: 44px; }
  .check input { width: 22px; height: 22px; }
  .small { font-size: 13px; color: var(--muted); margin: 6px 2px 0; }
  .menu .btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 0 14px; }

  /* Backup-Banner */
  #backupBanner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; background: var(--card); border-radius: 14px;
    box-shadow: var(--shadow); border-left: 4px solid var(--accent); padding: 10px 10px 10px 14px; margin: 2px 0 6px; font-size: 15px; }
  #backupBanner[hidden] { display: none !important; }
  #bbMsg { flex: 1 1 180px; font-weight: 600; }
  #backupBanner .bb-btns { display: flex; gap: 8px; margin-left: auto; }
  #backupBanner button { border: 0; border-radius: 10px; min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 600; }
  #bbNow { background: var(--accent); color: #fff; }
  #bbLater { background: var(--soft); color: var(--ink); }
  .ivs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .ivs .btn { margin: 0; font-size: 15px; padding: 0 6px; }
  #sheet .ivs .btn.on { background: var(--accent); color: #fff; }
  .menu-sec { margin: 4px 0 12px; }
  /* Toast */
  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 16px); margin: 0 auto; max-width: 500px;
    background: #1c1c1e; color: #fff; padding: 10px 10px 10px 16px; border-radius: 16px; display: flex; align-items: center; gap: 8px;
    opacity: 0; transform: translateY(30px); transition: all .25s; pointer-events: none; z-index: 30; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  #toast.show { opacity: 1; transform: none; pointer-events: auto; }
  #toastMsg { flex: 1; font-weight: 600; font-size: 15px; }
  #toast button { border: 0; background: rgba(255,255,255,.15); color: #fff; border-radius: 10px; min-height: 38px; padding: 0 12px; font-size: 15px; font-weight: 600; }
  /* Sprache */
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .langs .btn { flex: 1 1 0; min-width: 56px; text-align: center; padding: 0 4px; margin: 0; font-size: 15px; }
  #sheet .langs .btn.on { background: var(--accent); color: #fff; }
  .langlist .btn { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 0 14px; }
  #sheet .langlist .btn.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<!-- Startseite -->
<main id="home">
  <div id="backupBanner" role="status" hidden><span id="bbMsg"></span>
    <span class="bb-btns"><button type="button" id="bbLater"></button><button type="button" id="bbNow"></button></span></div>
  <div class="top">
    <button class="iconbtn" id="langBtn" type="button"></button>
    <button class="iconbtn" id="menuBtn" type="button" data-i18n="menuBtn" data-i18n-aria="menuAria"></button>
  </div>
  <h1 data-i18n="appTitle"></h1>
  <div id="list"></div>
  <div class="empty-state" id="emptyState" hidden><div>🔢</div><p data-i18n-html="emptyState"></p></div>
  <button id="newBtn" type="button" data-i18n="newBtn"></button>
</main>

<!-- Detailansicht -->
<main id="detail" hidden>
  <div class="top">
    <button class="iconbtn" id="backBtn" type="button" data-i18n="back"></button>
    <button class="iconbtn" id="editBtn" type="button" data-i18n="edit"></button>
  </div>
  <div class="d-head">
    <div class="emoji" id="dEmoji"></div>
    <div><h1 id="dName"></h1><div class="tile-sub" id="dSub"></div></div>
  </div>
  <button id="dPlus" type="button">+1</button>
  <div class="stats">
    <div class="stat"><b id="sToday">0</b><span data-i18n="statToday"></span></div>
    <div class="stat"><b id="sWeek">0</b><span data-i18n="statWeek"></span></div>
    <div class="stat"><b id="sMonth">0</b><span data-i18n="statMonth"></span></div>
    <div class="stat"><b id="sTotal">0</b><span data-i18n="statTotal"></span></div>
  </div>
  <div class="since" id="sSince"></div>

  <section class="card" id="roundCard">
    <h2 id="roundTitle"></h2>
    <ol class="rows" id="roundList"></ol>
  </section>
  <details class="card" id="pastCard">
    <summary id="pastSummary"></summary>
    <div id="pastList"></div>
  </details>

  <div class="row">
    <button class="btn danger" id="undoBtn" type="button" data-i18n="undoBtn"></button>
    <button class="btn" id="backdateBtn" type="button" data-i18n="backdateBtn"></button>
  </div>
  <div class="row">
    <button class="btn" id="copyOneBtn" type="button" data-i18n="copyOneBtn"></button>
  </div>

  <section class="card">
    <h2 id="entriesTitle"></h2>
    <ol class="rows" id="entryList"></ol>
  </section>
</main>

<div id="sheet" role="dialog" aria-modal="true"><div class="box" id="sheetBox"></div></div>
<div id="toast" role="status"><span id="toastMsg"></span><span id="toastBtns"></span></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>

const LANGS = ['de', 'en', 'it', 'es', 'fr'];
const LANG_KEY = 'zaehler-lang';
</script>
<script>
(() => {
'use strict';
/* =========================================================================
   Datenmodell (siehe DATENMODELL.md)
   db = { version, counters: [Counter], entries: [Entry], settings: {onboarded} }
   Counter = { id, name, emoji, color, roundSize|null, askNote, order, createdAt }
   Entry   = { id, counterId, timestamp, note?, dateOnly? }
   Runden und Nummern werden NICHT gespeichert, sondern aus der sortierten
   Eintragsliste abgeleitet (Eintrag i -> Runde floor(i/roundSize)+1, Nr. i%roundSize+1).
   Die Sprache liegt getrennt in localStorage["zaehler-lang"] (nicht im Backup).
   ========================================================================= */
const KEY = 'zaehler-v1';
const VERSION = 1;               // Datenformat (Backup) – bleibt 1
const APP_BUILD = 6, APP_DATE = '2026-10-29'; // sichtbare App-Version (Daten-Menü)
const COLORS = ['#ff9500', '#ff3b30', '#ff2d55', '#af52de', '#5856d6', '#007aff', '#32ade6', '#00c7be', '#34c759', '#a2845e', '#8e8e93'];
const EMOJIS = ['🥚','☕️','💧','🏃','🏋️','⛽️','💊','🍺','🚬','📚','🧘','🚴','🍎','🐶','💤','🧹','🚗','💶','✅','⭐️'];
const EIER_SEED = ['2026-09-28', '2026-10-05', '2026-10-12', '2026-10-20', '2026-10-26'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/* Letztes Emoji-Graphem eines Textes (ZWJ-Sequenzen, Hautfarben, Flaggen, Keycaps) oder '' */
const EMOJI_TEST = /\p{Extended_Pictographic}|\p{Regional_Indicator}|\u20E3/u;
const EMOJI_SEQ = /\p{Regional_Indicator}{2}|[0-9#*]\uFE0F?\u20E3|\p{Extended_Pictographic}[\uFE0E\uFE0F]?\p{Emoji_Modifier}?[\u{E0020}-\u{E007F}]*(?:\u200D\p{Extended_Pictographic}[\uFE0E\uFE0F]?\p{Emoji_Modifier}?)*/gu;
const lastEmojiRegex = s => { const m = String(s ?? '').match(EMOJI_SEQ); return m ? m[m.length - 1] : ''; }; // Fallback ohne Intl.Segmenter
function lastEmoji(text) {
  const s = String(text ?? '');
  if (typeof Intl === 'undefined' || !Intl.Segmenter) return lastEmojiRegex(s);
  const gs = [...new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(s)].map(x => x.segment);
  for (let i = gs.length - 1; i >= 0; i--) {
    const g = gs[i];
    if (/^\p{Regional_Indicator}$/u.test(g)) continue; // halbe Flagge ignorieren
    if (EMOJI_TEST.test(g)) return g;
  }

}

  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); })).toUpperCase();

/* ---------- Sprache ---------- */
const baseOf = p => String(p || '').toLowerCase().split(/[-_]/)[0];
function detectLang() {
  try { const s = localStorage.getItem(LANG_KEY); if (LANGS.includes(s)) return s; } catch (e) {}
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  for (const p of prefs) if (LANGS.includes(baseOf(p))) return baseOf(p);

}
let lang = detectLang(), L = I18N[lang], plural, dateFmt, timeFmt;
function intlLocale() { // Region vom Gerät übernehmen, wenn die Gerätesprache passt (z. B. de-AT, en-US)
  const nav = (navigator.languages || [navigator.language]).find(p => baseOf(p) === lang);
  try { if (nav && Intl.DateTimeFormat.supportedLocalesOf(nav).length) return nav; } catch (e) {}
  return L.locale;
}

  const loc = intlLocale();
  plural = new Intl.PluralRules(loc);
  dateFmt = new Intl.DateTimeFormat(loc, { day: '2-digit', month: '2-digit', year: 'numeric' });
  timeFmt = new Intl.DateTimeFormat(loc, { hour: '2-digit', minute: '2-digit' });
}
setupIntl();
function t(key, p = {}) {
  let v = L[key];
  if (v === undefined) { console.error('i18n: fehlender Schlüssel ' + lang + '.' + key); v = I18N.en[key] ?? I18N.de[key] ?? ('⟦' + key + '⟧'); }
  if (v && typeof v === 'object') v = v[plural.select(p.n ?? 0)] ?? v.other;
  return String(v).replace(/\{(\w+)\}/g, (m, k) => (p[k] !== undefined ? p[k] : m));
}
function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('langBtn').textContent = `🌐 ${lang.toUpperCase()}`; $('langBtn').setAttribute('aria-label', t('languageAria'));
}
function setLang(l, remember = true) {
  if (!LANGS.includes(l)) return;
  lang = l; L = I18N[l]; setupIntl();
  if (remember) { try { localStorage.setItem(LANG_KEY, l); } catch (e) {} }
  applyStatic(); render();
}
const langButtons = () => LANGS.map(l => `<button class="btn${l === lang ? ' on' : ''}" type="button" data-v="lang:${l}" data-lang="${l}" aria-label="${esc(I18N[l].langName)}">${I18N[l].flag} ${l.toUpperCase()}</button>`).join('');

/* ---------- Datum & Zeit ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => dateFmt.format(d);
const fmtTime = d => timeFmt.format(d);
const fmtEntry = e => { const d = new Date(e.timestamp); return e.dateOnly ? fmtDate(d) : `${fmtDate(d)}, ${fmtTime(d)}`; };
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startOfWeek = d => { const s = startOfDay(d); const wd = (s.getDay() + 6) % 7; s.setDate(s.getDate() - wd); return s; }; // Montag (in allen Sprachen)
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 864e5);
function relDay(d) {
  const n = dayDiff(new Date(), d);
  if (n === 0) return t('relToday'); if (n === 1) return t('relYesterday'); if (n === 2) return t('relDayBefore');
  if (n > 0 && n < 7) return t('relDaysAgo', { n });
  return fmtDate(d);
}
function lastText(e) {
  if (!e) return t('noEntryYet');
  const d = new Date(e.timestamp);
  const r = relDay(d);
  return e.dateOnly ? r : `${r}, ${fmtTime(d)}`;
}
const daysText = n => t('durDays', { n });
function duration(ms) {
  if (ms < 0) ms = 0;
  const min = Math.floor(ms / 6e4), h = Math.floor(min / 60), days = Math.floor(h / 24);
  if (min < 1) return t('justNow');
  if (h < 1) return t('durMin', { n: min });
  if (days < 1) return `${t('durHours', { n: h })} ${t('durMin', { n: min % 60 })}`;
  if (days < 60) return `${daysText(days)}${h % 24 ? ` ${t('durHours', { n: h % 24 })}` : ''}`;
  return daysText(days);
}
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localDateNoon = ymd => { const [y, m, d] = ymd.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };

/* ---------- Speicher ---------- */
const freshDb = () => ({ version: VERSION, counters: [], entries: [], settings: { onboarded: false } });
let db = load();
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.counters) && Array.isArray(s.entries)) { s.settings = s.settings || {}; return s; }
  } catch (e) {}
  return freshDb();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { toast(t('saveFailed')); }
}
/* ---------- Abfragen ---------- */
const counter = id => db.counters.find(c => c.id === id);
const sortedCounters = () => [...db.counters].sort((a, b) => a.order - b.order);
const byTime = (a, b) => (a.timestamp < b.timestamp ? -1 : a.timestamp > b.timestamp ? 1 : 0);
const entriesOf = id => db.entries.filter(e => e.counterId === id).sort(byTime);
/** Runden-Info abgeleitet aus Anzahl + Rundengröße */
function roundInfo(c, list) {
  const total = list.length, n = c.roundSize;
  if (!n) return { total, round: null };
  const roundIdx = total ? Math.floor((total - 1) / n) : 0;         // 0-basiert: aktuelle (letzte belegte) Runde
  const inRound = total - roundIdx * n;                              // 0..n Einträge in aktueller Runde
  const full = total > 0 && inRound === n;
  return { total, n, round: roundIdx + 1, inRound, full, next: (total % n) + 1,
           current: list.slice(roundIdx * n, roundIdx * n + n), past: Array.from({ length: roundIdx }, (_, i) => list.slice(i * n, i * n + n)) };
}
function stats(list) {
  const now = new Date(), d0 = startOfDay(now), w0 = startOfWeek(now), m0 = startOfMonth(now);
  let today = 0, week = 0, month = 0;
  for (const e of list) { const ts = new Date(e.timestamp); if (ts >= d0) today++; if (ts >= w0) week++; if (ts >= m0) month++; }
  const last = list[list.length - 1];
  const avg = list.length > 1 ? (new Date(last.timestamp) - new Date(list[0].timestamp)) / (list.length - 1) : null;
  return { today, week, month, total: list.length, last, avg };
}
function countLabel(c, list) {
  const r = roundInfo(c, list);
  return r.round ? { big: `${r.inRound}<small>/${r.n}</small>`, sub: r.full ? t('tileRoundFull', { r: r.round }) : t('tileRound', { r: r.round, next: r.next }), r }
                 : { big: `${r.total}`, sub: '', r };
}

/* ---------- Mutationen ---------- */
function addEntry(cid, extra = {}) {
  const e = { id: uuid(), counterId: cid, timestamp: isoNow(), ...extra };
  if (!e.note) delete e.note;
  db.entries.push(e); save(); return e;
}
function removeEntry(id) { db.entries = db.entries.filter(e => e.id !== id); save(); }
function upsertCounter(data) {
  let c = data.id && counter(data.id);
  if (c) Object.assign(c, data);
  else { c = { id: uuid(), order: db.counters.reduce((m, x) => Math.max(m, x.order + 1), 0), createdAt: isoNow(), ...data }; db.counters.push(c); }
  save(); return c;
}
function deleteCounter(id) { db.counters = db.counters.filter(c => c.id !== id); db.entries = db.entries.filter(e => e.counterId !== id); save(); }
function addEierSeed(dates = EIER_SEED) {
  // Name in der aktuellen Sprache; danach ist es ein normaler Nutzer-Zählername und wird nicht übersetzt.
  const c = upsertCounter({ name: t('seedName'), emoji: '🥚', color: '#ff9500', roundSize: 10, askNote: false });
  for (const ymd of dates) db.entries.push({ id: uuid(), counterId: c.id, timestamp: isoNow(localDateNoon(ymd)), dateOnly: true });
  save(); return c;
}

/* ---------- UI: Toast & Sheet ---------- */
let toastTimer;
function toast(msg, buttons = [], ms = 2400) {
  $('toastMsg').textContent = msg;
  const bx = $('toastBtns'); bx.innerHTML = '';
  buttons.forEach(([label, fn]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
    b.onclick = () => { hideToast(); fn(); }; bx.appendChild(b); });
  $('toast').classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms);
}
const hideToast = () => $('toast').classList.remove('show');

let sheetResolve = null;
function openSheet(html, onMount) {
  return new Promise(res => {
    if (sheetResolve) sheetResolve(null);
    sheetResolve = res; hideToast(); $('sheetBox').innerHTML = html; $('sheet').classList.add('show');
    $('sheetBox').querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => closeSheet(b.dataset.v)));
    if (onMount) onMount($('sheetBox'));
  });
}
function closeSheet(v = null) {

  $('sheet').classList.remove('show'); const r = sheetResolve; sheetResolve = null; if (r) r(v); }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(null); });
const confirmBox = (text, yes = t('ok'), danger = false, no = t('cancel')) =>
  openSheet(`<p>${esc(text)}</p><div class="row"><button class="btn" data-v="no" type="button">${esc(no)}</button>
    <button class="btn ${danger ? 'danger' : 'primary'}" data-v="yes" id="sheetYes" type="button">${esc(yes)}</button></div>`).then(v => v === 'yes');

/* ---------- Routing ---------- */
const currentId = () => { const m = location.hash.match(/^#c=(.+)$/); return m ? decodeURIComponent(m[1]) : null; };

/* ---------- Rendering ---------- */
function render() {

}
function renderHome() {

  const cs = sortedCounters();
  $('emptyState').hidden = cs.length > 0;

    const es = entriesOf(c.id), lab = countLabel(c, es), last = es[es.length - 1];

    el.className = 'tile'; el.style.setProperty('--c', c.color); el.dataset.id = c.id;
    el.innerHTML = `<button class="tile-main" type="button" data-open>
        <span class="emoji">${esc(c.emoji || '🔢')}</span>
        <span class="tile-text"><div class="tile-name">${esc(c.name)}</div>
          <div class="tile-count">${lab.big}</div>
          ${lab.r.round ? `<div class="bar"><i style="width:${lab.r.inRound / lab.r.n * 100}%"></i></div>` : ''}
          ${lab.sub ? `<div class="tile-sub">${esc(lab.sub)}</div>` : ''}<div class="tile-sub">${esc(t('lastLabel', { t: lastText(last) }))}</div></span>
      </button>
      <button class="plus" type="button" data-plus aria-label="${esc(c.name)} +1">+1</button>`;
    el.querySelector('[data-open]').onclick = () => go(c.id);
    el.querySelector('[data-plus]').onclick = () => tapPlus(c.id, el);
    list.appendChild(el);
  }
}
function renderDetail(c) {
  const d = $('detail'); d.style.setProperty('--c', c.color);
  const es = entriesOf(c.id), lab = countLabel(c, es), st = stats(es), r = lab.r;
  $('dEmoji').textContent = c.emoji || '🔢'; $('dName').textContent = c.name;
  $('dSub').textContent = r.round ? t('detailRound', { i: r.inRound, n: r.n, r: r.round, next: r.next }) + (r.full ? t('detailNewRound') : '') : t('entriesCount', { n: r.total });
  $('dPlus').textContent = r.round ? t('plusNr', { n: r.next }) : '+1';
  $('sToday').textContent = st.today; $('sWeek').textContent = st.week; $('sMonth').textContent = st.month; $('sTotal').textContent = st.total;
  $('sSince').innerHTML = st.last
    ? `${esc(t('sinceLast'))}: <b>${esc(st.last.dateOnly && dayDiff(new Date(), new Date(st.last.timestamp)) >= 1
        ? daysText(dayDiff(new Date(), new Date(st.last.timestamp)))
        : duration(Date.now() - new Date(st.last.timestamp)))}</b>${st.avg ? ` · ${esc(t('avgGap'))}: <b>${esc(duration(st.avg))}</b>` : ''}`
    : esc(t('noEntryTap'));

  // Runde

    $('roundTitle').textContent = t('roundTitle', { r: r.round, i: r.inRound, n: r.n });
    const ol = $('roundList'); ol.innerHTML = '';
    for (let i = 1; i <= r.n; i++) {
      const e = r.current[i - 1], li = document.createElement('li');
      li.className = e ? 'filled' : 'emptyrow';
      if (e && i === r.current.length) li.classList.add('latest');
      if (!e && !r.full && i === r.next) li.classList.add('next');
      li.innerHTML = `<span class="nr">${i}</span><span class="when">${e ? esc(fmtEntry(e)) + (e.note ? `<span class="note">${esc(e.note)}</span>` : '') : '—'}</span>`;
      ol.appendChild(li);
    }
    if (r.full) { const li = document.createElement('li'); li.innerHTML = `<span class="when" style="color:var(--c);font-weight:600">${esc(t('roundFullRow'))}</span>`; ol.appendChild(li); }
    $('pastSummary').textContent = t('pastSummary', { n: r.past.length });
    $('pastList').innerHTML = r.past.length ? r.past.map((rr, i) => ({ rr, i })).reverse().map(({ rr, i }) =>
      `<div class="past"><h3>${esc(t('pastItem', { r: i + 1, a: fmtDate(new Date(rr[0].timestamp)), b: fmtDate(new Date(rr[rr.length - 1].timestamp)) }))}</h3>
       <p>${rr.map((e, k) => `${k + 1}: ${esc(fmtDate(new Date(e.timestamp)))}`).join(' · ')}</p></div>`).join('')
      : `<p class="hint">${esc(t('noPastRound'))}</p>`;
  }
  $('undoBtn').disabled = !es.length;

  // Alle Einträge (neueste zuerst)
  $('entriesTitle').textContent = t('allEntries', { n: es.length });

/* ---------- Export / Import / Text ---------- */
function backupObject() { return { format: 'zaehler-backup', version: VERSION, exportedAt: isoNow(), counters: db.counters, entries: db.entries }; }
/* ---------- Backup-Erinnerung (Geräte-Einstellungen, nicht Teil der Nutzerdaten/des Backups) ---------- */
const BK_LAST = 'zaehler-backup-last', BK_IV = 'zaehler-backup-interval', BK_SNOOZE = 'zaehler-backup-snooze';
const IVS = { off: 0, daily: 1, weekly: 7, monthly: 30 };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const backupInterval = () => (lsGet(BK_IV) in IVS ? lsGet(BK_IV) : 'weekly');
const lastBackup = () => { const v = lsGet(BK_LAST); const d = v ? new Date(v) : null; return d && !isNaN(d) ? d : null; };
function backupDue() {
  const days = IVS[backupInterval()];
  if (!days || !db.counters.length || !db.entries.length) return null;
  const now = Date.now(), snooze = new Date(lsGet(BK_SNOOZE) || 0);
  if (!isNaN(snooze) && snooze > now) return null;
  const last = lastBackup();
  // Noch nie gesichert: ab dem ältesten Zähler rechnen, damit nicht schon direkt nach dem ersten Start gemahnt wird.
  const ref = last || new Date(Math.min(...db.counters.map(c => +new Date(c.createdAt) || now)));
  const ago = Math.floor((now - ref) / 864e5);
  return ago >= days ? { last, ago } : null;
}
function updateBanner() {
  const due = backupDue(), el = $('backupBanner');
  el.hidden = !due;
  if (!due) return;
  $('bbMsg').textContent = due.last ? t('bannerDue', { n: due.ago }) : t('bannerNever');
  $('bbNow').textContent = t('backupNow'); $('bbLater').textContent = t('later');
}
const lastBackupText = () => { const d = lastBackup(); return d ? `${relDay(d)}, ${fmtTime(d)}` : t('never'); };
/** Backup teilen (iPhone: „In Dateien sichern“ → iCloud Drive), sonst Download. Ergebnis: 'shared' | 'downloaded' | 'aborted' */
async function exportJson() {
  const json = JSON.stringify(backupObject(), null, 2);
  const d = new Date(), name = `zaehler-backup-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  let result = null;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: t('backupTitle') }); result = 'shared'; }
  } catch (e) { if (e && e.name === 'AbortError') { updateBanner(); return 'aborted'; } }
  if (!result) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    result = 'downloaded';
  }
  lsSet(BK_LAST, isoNow()); try { localStorage.removeItem(BK_SNOOZE); } catch (e) {} updateBanner();
  toast(t('exported'));
  return result;
}
function validateBackup(o) {
  if (!o || typeof o !== 'object' || !Array.isArray(o.counters) || !Array.isArray(o.entries)) throw new Error(t('errBackupFile'));
  const counters = o.counters.map(c => {
    if (!c || typeof c.id !== 'string' || typeof c.name !== 'string') throw new Error(t('errBackupCounter'));
    const rs = c.roundSize == null ? null : parseInt(c.roundSize, 10);
    return { id: c.id, name: c.name.slice(0, 40), emoji: typeof c.emoji === 'string' && c.emoji ? c.emoji : '🔢',
      color: /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : COLORS[5], roundSize: rs >= 2 ? rs : null, askNote: !!c.askNote,
      order: Number.isFinite(c.order) ? c.order : 0, createdAt: typeof c.createdAt === 'string' ? c.createdAt : isoNow() };
  });
  const ids = new Set(counters.map(c => c.id));
  const entries = o.entries.filter(e => e && typeof e.id === 'string' && ids.has(e.counterId) && !isNaN(new Date(e.timestamp))).map(e => {
    const x = { id: e.id, counterId: e.counterId, timestamp: isoNow(new Date(e.timestamp)) };
    if (typeof e.note === 'string' && e.note.trim()) x.note = e.note.trim(); if (e.dateOnly) x.dateOnly = true; return x;
  });
  return { counters, entries };
}
async function importJson(file) {
  let data;
  try { data = validateBackup(JSON.parse(await file.text())); }
  catch (e) { toast(t('importFailed', { msg: (e instanceof SyntaxError ? '' : e.message) || t('fileUnreadable') }), [], 4000); return; }
  const v = await openSheet(`<h2>${esc(t('importTitle'))}</h2><p>${t('importBodyHtml', { c: data.counters.length, e: data.entries.length })}</p>
    <div class="row"><button class="btn" type="button" data-v="merge" id="impMerge">${esc(t('merge'))}</button><button class="btn danger" type="button" data-v="replace" id="impReplace">${esc(t('replace'))}</button></div>
    <div class="row"><button class="btn" type="button" data-v="no">${esc(t('cancel'))}</button></div>`);
  if (v === 'replace') { db.counters = data.counters; db.entries = data.entries; }
  else if (v === 'merge') {
    for (const c of data.counters) { const ex = counter(c.id); if (ex) Object.assign(ex, c); else db.counters.push(c); }
    const have = new Set(db.entries.map(e => e.id)); for (const e of data.entries) if (!have.has(e.id)) db.entries.push(e);
  } else return;
  db.settings.onboarded = true; save(); go(null); render(); toast(t('importDone', { n: data.counters.length }));
}
function counterText(c) {
  const es = entriesOf(c.id), r = roundInfo(c, es);
  const lines = [`${c.emoji} ${c.name}`];
  const line = (e, k, sep) => `${k + 1}${sep}${fmtEntry(e)}${e.note ? ' – ' + e.note : ''}`;
  if (!es.length) lines.push(t('txtNoEntries'));
  else if (r.round) {
    r.past.forEach((rr, i) => { lines.push(t('txtRound', { r: i + 1 })); rr.forEach((e, k) => lines.push(line(e, k, ' = '))); });
    lines.push(r.full ? t('txtRoundFull', { r: r.round }) : t('txtRoundPart', { r: r.round, i: r.inRound, n: r.n }));
    r.current.forEach((e, k) => lines.push(line(e, k, ' = ')));
  } else { es.forEach((e, k) => lines.push(line(e, k, '. '))); lines.push(t('txtTotal', { n: es.length })); }
  return lines.join('\n');
}

/* ---------- Updates / Service Worker ---------- */
let swReg = null, reloadPending = false;
const SW_RELOAD_KEY = 'zaehler-sw-reloaded';
function swUpdate() { if (swReg) swReg.update().catch(() => {}); }
function reloadForUpdate() {
  // Endlosschleife verhindern: höchstens ein automatischer Reload pro Seitenaufruf-Kette innerhalb 30 s
  let last = 0; try { last = +sessionStorage.getItem(SW_RELOAD_KEY) || 0; } catch (e) {}
  const now = performance.timeOrigin + performance.now();
  if (last && now - last < 30000) return;
  try { sessionStorage.setItem(SW_RELOAD_KEY, String(now)); } catch (e) {}
  if ($('sheet').classList.contains('show')) { reloadPending = true; return; } // nicht mitten im Bearbeiten neu laden
  location.reload();
}
function setupServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) reloadForUpdate(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => { swReg = r; swUpdate(); }).catch(() => {});
}
async function checkForUpdates() {
  toast(t('updating'), [], 10000);
  const scope = new URL('./', location.href).href;
  try { // nur die eigene Registrierung und eigene Caches – localStorage (Nutzerdaten) bleibt unangetastet
    const regs = navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? await navigator.serviceWorker.getRegistrations() : [];
    await Promise.all(regs.filter(r => r.scope === scope).map(r => r.unregister()));
  } catch (e) {}
  try { const ks = await caches.keys(); await Promise.all(ks.filter(k => k.startsWith('zaehler-')).map(k => caches.delete(k))); } catch (e) {}
  try { sessionStorage.removeItem(SW_RELOAD_KEY); } catch (e) {}
  location.replace(location.pathname + '?update=' + Date.now() + location.hash); // Query umgeht den HTTP-Cache
}
// Query vom Update-Reload wieder entfernen
if (/[?&]update=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);

/* ---------- Verdrahtung ---------- */
$('newBtn').onclick = () => editCounter();
$('bbNow').onclick = () => exportJson();
$('bbLater').onclick = () => { lsSet(BK_SNOOZE, isoNow(new Date(Date.now() + 864e5))); updateBanner(); };
$('menuBtn').onclick = menu;
$('langBtn').onclick = langMenu;
$('backBtn').onclick = () => go(null);
$('editBtn').onclick = () => editCounter(currentId());
$('dPlus').onclick = () => tapPlus(currentId());
$('undoBtn').onclick = () => undoLast(currentId());
$('backdateBtn').onclick = () => editEntry(null, true, currentId());
$('copyOneBtn').onclick = () => { const c = counter(currentId()); if (c) copyText(counterText(c)); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) { db = load(); render(); swUpdate(); } });
setInterval(() => { if (!document.hidden && !$('sheet').classList.contains('show')) render(); }, 60000);

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
applyStatic();
render();
if (!db.settings.onboarded) onboarding();
setupServiceWorker();
window.__zaehler = { get db() { return db; }, get lang() { return lang; }, setLang, I18N, LANGS, lastEmoji, lastEmojiRegex, build: APP_BUILD }; // für Tests
})();
</script>
